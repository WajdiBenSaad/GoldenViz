name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build docs with warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/goldenviz-wheel-smoke
          /tmp/goldenviz-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/goldenviz-wheel-smoke/bin/python - <<'PY'
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import GoldenViz as gv

          fig, ax = plt.subplots()
          ax.plot([2021, 2022, 2023], [10, 13, 16])
          ax.set_title("Revenue trend by year")
          ax.set_xlabel("Year")
          ax.set_ylabel("Revenue (EUR)")
          report = gv.analyze(fig)
          assert len(report.axes_reports) == 1
          assert len(report.rule_results) == 25
          plt.close(fig)
          PY
